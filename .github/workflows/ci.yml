name: SATQUERY AI — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend: lint + type check + tests ─────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff -q
          ruff check . --select=E,W,F --ignore=E501,W503 || true

      - name: Run backend tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_SECRET_KEY: ci-test-jwt-key-not-for-production
          DATABASE_URL: sqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          UPLOAD_FOLDER: /tmp/satquery_ci_uploads
          REPORTS_FOLDER: /tmp/satquery_ci_reports
          CHANGE_DETECTION_ENABLED: "true"
          BLIP_ENABLED: "false"
          BLIP_VQA_ENABLED: "false"
          GROUNDING_DINO_ENABLED: "false"
          BIGEARTHNET_ENABLED: "false"
          SAR_ANALYSIS_ENABLED: "false"
        run: |
          mkdir -p /tmp/satquery_ci_uploads /tmp/satquery_ci_reports
          python -m pytest \
            ../tests/test_auth/test_auth.py \
            ../tests/test_evidence/test_evidence.py \
            ../tests/test_agents/test_agents.py \
            ../tests/test_satellite/test_satellite.py \
            ../tests/test_api/test_analysis_api.py \
            -v --tb=short -q \
            --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  # ── Security scan ────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit -q
      - name: Run bandit
        run: bandit -r backend/ -ll --exclude backend/.model_cache,backend/uploads || true

  # ── Docker build verification ─────────────────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t satquery-backend:ci .

      - name: Build worker image
        run: docker build -f worker/Dockerfile -t satquery-worker:ci .

      - name: Verify backend starts
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-test-secret \
            -e JWT_SECRET_KEY=ci-test-jwt \
            -e DATABASE_URL=sqlite:////tmp/test.db \
            -e FLASK_ENV=development \
            -e CHANGE_DETECTION_ENABLED=true \
            satquery-backend:ci \
            python -c "
import sys, os
sys.path.insert(0, '/app/backend')
from app import create_app
app = create_app()
client = app.test_client()
r = client.get('/health')
assert r.get_json()['status'] == 'ok', f'Health check failed: {r.get_json()}'
print('Docker health check passed')
"
