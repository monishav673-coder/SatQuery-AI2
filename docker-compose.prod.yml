# ── SATQUERY AI — Production Docker Compose ──────────────────────────────────
# Usage:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f
#
# REQUIRED: Copy .env.example to .env.production and fill in all values.
# Load with: docker compose -f docker-compose.prod.yml --env-file .env.production up -d

version: "3.9"

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-satquery_db}
      POSTGRES_USER:     ${POSTGRES_USER:-satquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satquery} -d ${POSTGRES_DB:-satquery_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - satquery_net

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - satquery_net

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      FLASK_ENV: production
      DEBUG: "false"
      SECRET_KEY:     ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL:   ${DATABASE_URL}
      REDIS_URL:      ${REDIS_URL}
      UPLOAD_FOLDER:  /app/backend/uploads
      REPORTS_FOLDER: /app/backend/uploads/reports
      CORS_ORIGINS:   ${CORS_ORIGINS}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-nominatim}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SATELLITE_PROVIDER:  ${SATELLITE_PROVIDER:-none}
      SENTINEL_HUB_CLIENT_ID:     ${SENTINEL_HUB_CLIENT_ID:-}
      SENTINEL_HUB_CLIENT_SECRET: ${SENTINEL_HUB_CLIENT_SECRET:-}
      BLIP_ENABLED:              ${BLIP_ENABLED:-false}
      BLIP_VQA_ENABLED:          ${BLIP_VQA_ENABLED:-false}
      GROUNDING_DINO_ENABLED:    ${GROUNDING_DINO_ENABLED:-false}
      GROUNDING_DINO_WEIGHTS_PATH: ${GROUNDING_DINO_WEIGHTS_PATH:-}
      BIGEARTHNET_ENABLED:       ${BIGEARTHNET_ENABLED:-false}
      BIGEARTHNET_MODEL_PATH:    ${BIGEARTHNET_MODEL_PATH:-}
      CHANGE_DETECTION_ENABLED:  ${CHANGE_DETECTION_ENABLED:-true}
      CHANGE_DETECTION_MODEL_PATH: ${CHANGE_DETECTION_MODEL_PATH:-}
      SAR_ANALYSIS_ENABLED:      ${SAR_ANALYSIS_ENABLED:-false}
      SMS_PROVIDER:              ${SMS_PROVIDER:-}
      SMS_PROVIDER_API_KEY:      ${SMS_PROVIDER_API_KEY:-}
      SMS_SENDER_ID:             ${SMS_SENDER_ID:-SATQRY}
      MODEL_CACHE_DIR:           /app/backend/.model_cache
      SEND_SECURITY_HEADERS:     "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads
      - model_cache:/app/backend/.model_cache
    networks:
      - satquery_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Worker ────────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: always
    environment:
      FLASK_ENV:      production
      SECRET_KEY:     ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL:   ${DATABASE_URL}
      REDIS_URL:      ${REDIS_URL}
      UPLOAD_FOLDER:  /app/backend/uploads
      CHANGE_DETECTION_ENABLED: ${CHANGE_DETECTION_ENABLED:-true}
      MODEL_CACHE_DIR: /app/backend/.model_cache
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads
      - model_cache:/app/backend/.model_cache
    networks:
      - satquery_net
    deploy:
      replicas: 2

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - satquery_net

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  model_cache:

networks:
  satquery_net:
    driver: bridge
