# ── SATQUERY AI — Nginx Production Configuration ────────────────────────────
# Handles HTTPS termination, reverse proxy to backend, compression, security.

upstream satquery_backend {
    server backend:5000;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # ── TLS certificates ──────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Limits ────────────────────────────────────────────────────────────
    client_max_body_size  110M;
    client_body_timeout   60s;
    client_header_timeout 30s;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ── API proxy ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://satquery_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # ── SSE progress stream — needs long-lived connection ─────────────────
    location ~ ^/api/analysis/[^/]+/progress$ {
        proxy_pass         http://satquery_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 620s;
        chunked_transfer_encoding on;
    }

    # ── Uploads (served directly by Nginx for efficiency) ─────────────────
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend (served by Flask, proxied through) ────────────────────────
    location / {
        proxy_pass         http://satquery_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Health check endpoint (direct, no auth) ────────────────────────────
    location = /health {
        proxy_pass http://satquery_backend/health;
        access_log off;
    }
}
